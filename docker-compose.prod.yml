services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lapor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-lapor}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lapor} -d ${POSTGRES_DB:-lapor}"]
      interval: 5s
      timeout: 3s
      retries: 10

  lapor-api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:?APP_BASE_URL wajib diisi}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lapor}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lapor}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET wajib diisi}
      NIK_ENC_KEY: ${NIK_ENC_KEY:?NIK_ENC_KEY wajib diisi}
      NIK_HASH_PEPPER: ${NIK_HASH_PEPPER:?NIK_HASH_PEPPER wajib diisi}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      UPLOAD_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      TZ: Asia/Jakarta
      PGTZ: Asia/Jakarta
    volumes:
      - uploads_prod:/data/uploads

  lapor-web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - lapor-api
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  pgdata_prod:
  uploads_prod:
