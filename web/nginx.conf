# Nginx kecil di dalam container lapor-web: file statis React + proxy /api.
# Rate limit dan HTTPS ditangani Nginx lama di depan container ini.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64k;

    resolver 127.0.0.11 valid=10s;
    set $upstream http://lapor-api:8000;

    # ^~ wajib: tanpa ini aturan ekstensi di bawah mengambil alih file aset
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Upload laporan: batas body dinaikkan hanya di sini
    location ^~ /api/reports {
        client_max_body_size 16m;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location ^~ /api/ {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 15s;
    }

    # Berkas dengan ekstensi harus ada, kalau tidak 404 (bukan index.html)
    location ~* \.[a-z0-9]+$ {
        try_files $uri =404;
    }

    # Rute React (tanpa titik) jatuh ke index.html
    location / {
        try_files $uri /index.html;
    }
}
